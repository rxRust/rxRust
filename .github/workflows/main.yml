name: CI

on:
  merge_group:
  pull_request:
  push:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Code Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup install --profile minimal
      - run: cargo fmt --all -- --check

  lint:
    name: Clippy Lint (all-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup install --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  stable-features:
    name: Compute stable features
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.stable_features.outputs.features }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup install --profile minimal stable
      - name: Compute stable feature set (exclude nightly)
        id: stable_features
        run: |
          FEATURES=$(python3 - <<'PY'
          import json, subprocess

          meta = subprocess.check_output(
            ["rustup", "run", "stable", "cargo", "metadata", "--no-deps", "--format-version=1"],
            text=True,
          )
          data = json.loads(meta)
          pkg = next(p for p in data["packages"] if p["name"] == "rxrust")
          features = sorted(k for k in pkg["features"].keys() if k not in ("default", "nightly"))
          print(",".join(features))
          PY
          )
          echo "features=$FEATURES" >> "$GITHUB_OUTPUT"
  check-stable:
    name: Cargo Check (stable)
    runs-on: ubuntu-latest
    needs: stable-features
    steps:
      - uses: actions/checkout@v4
      - run: rustup install --profile minimal stable
      - uses: Swatinem/rust-cache@v2
      - run: rustup run stable cargo check --all-targets --no-default-features --features "${{ needs.stable-features.outputs.features }}"
      - run: rustup run stable cargo check --no-default-features --features "${{ needs.stable-features.outputs.features }}" --lib
        env:
          RUSTFLAGS: ""
          CARGO_ENCODED_RUSTFLAGS: ""

  check:
    name: Cargo Check (all-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup install --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features
      - run: cargo check --all-features --lib
        env:
          RUSTFLAGS: ""
          CARGO_ENCODED_RUSTFLAGS: ""

  test-stable:
    name: Tests (stable)
    runs-on: ubuntu-latest
    needs: [check-stable, stable-features]
    steps:
      - uses: actions/checkout@v4
      - run: rustup install --profile minimal stable
      - uses: Swatinem/rust-cache@v2
      - run: rustup run stable cargo test --no-default-features --features "${{ needs.stable-features.outputs.features }}"
      - run: rustup run stable cargo test --examples --no-default-features --features "${{ needs.stable-features.outputs.features }}"

  test:
    name: Tests (all-features)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: rustup install --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features
      - run: cargo test --examples --all-features

  test-wasm:
    name: WASM Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup install --profile minimal stable
      - uses: Swatinem/rust-cache@v2
      - run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - run: RUSTUP_TOOLCHAIN="stable" wasm-pack test --node

  ci:
    name: CI Status
    runs-on: ubuntu-latest
    needs:
      [
        format,
        lint,
        stable-features,
        check-stable,
        check,
        test-stable,
        test,
        test-wasm,
      ]
    if: always()
    steps:
      - name: Check CI Status
        run: |
          if [ "${{ needs.format.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.stable-features.result }}" != "success" ] || \
             [ "${{ needs.check-stable.result }}" != "success" ] || \
             [ "${{ needs.check.result }}" != "success" ] || \
             [ "${{ needs.test-stable.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.test-wasm.result }}" != "success" ]; then
            echo "CI failed"
            exit 1
          fi
